name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: thumbv7m-none-eabi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ env.RUST_TARGET }}
          override: true
          components: rustfmt, clippy

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --verbose

      - name: Check clippy (host)
        run: cargo clippy --all-targets -- --deny warnings

      - name: Check clippy (firmware)
        run: cargo clippy --target ${{ env.RUST_TARGET }} -- --deny warnings

      - name: Build firmware (release)
        run: cargo build --release --target ${{ env.RUST_TARGET }} --verbose

      - name: Print binary size
        run: arm-none-eabi-size target/${{ env.RUST_TARGET }}/release/NumCore || true

      - name: Run QEMU smoke tests
        run: |
          OUTPUT_FILE=$(mktemp --suffix=.log)
          (printf " "; cat test_inputs.txt) | \
            timeout 15s qemu-system-arm -M lm3s811evb -serial stdio -display none \
              -kernel target/${{ env.RUST_TARGET }}/release/NumCore > "$OUTPUT_FILE" 2>&1 || true
          cp "$OUTPUT_FILE" /tmp/qemu-output.log
          echo "QEMU output saved to artifact"

      - name: Upload QEMU output
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-output
          path: /tmp/qemu-output.log

  deploy:
    runs-on: ubuntu-latest
    needs: [test]

    environment:
      name: production
      url: https://github.com/faris0x/NumCore/releases

    steps:
      - name: Waiting for reviewer approval
        run: |
          echo "All checks passed. QEMU output uploaded."
          echo "Review: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "NumCore v${{ github.run_number }}"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
