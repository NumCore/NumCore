name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: thumbv7m-none-eabi

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ env.RUST_TARGET }}
        override: true
    - name: Install QEMU and other tools
      run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@v2
    - name: Build firmware
      run: cargo build --release --target ${{ env.RUST_TARGET }} --verbose
    - name: Run tests in QEMU & verify output
      run: |
        OUTPUT_FILE=$(mktemp)
        timeout 5s qemu-system-arm -M lm3s811evb -nographic -serial mon:stdio \
        -semihosting-config enable=on, target=native \
        -kernel target/thumbv7m-none-eabi/release/NumCore \
        < test_inputs.txt > "$OUTPUT_FILE" 2>&1 || true
        echo "=== QEMU output ==="
        cat "$OUTPUT_FILE"
        echo "==================="
        expected_strings=(
          "> 2+2"
          "= 4"
          "> sin(pi)"
          "= 0"
          "> (2+3)/10"
          "= 0.5"
        )

        all_found=true
        for expected in "${expected_strings[@]}"; do
          if grep -F "$expected" "$OUTPUT_FILE" > /dev/null; then
            echo "Found: $expected"
          else
            echo "Missing: $expected"
            all_found=false
          fi
        done

        if [ "$all_found" = true ]; then
          echo "All tests passed"
        else
          echo "Some tests failed"
          exit 1
        fi
    - name: Clean up
      if: always()
      run: |
        if [ -n "$OUTPUT_FILE" ] && [ -f "$OUTPUT_FILE" ]; then
          rm -f "$OUTPUT_FILE"
        fi
