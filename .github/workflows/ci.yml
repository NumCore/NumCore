name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: thumbv7m-none-eabi

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ env.RUST_TARGET }}
          override: true
          components: rustfmt

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --verbose

      - name: Build firmware (release)
        run: cargo build -p numcore-lm3s811 --release --target ${{ env.RUST_TARGET }} --verbose

      - name: Run host-side unit tests (math engine)
        run: cargo test -p numcore_math --tests --verbose

      - name: Print binary size
        run: arm-none-eabi-size target/${{ env.RUST_TARGET }}/release/NumCore || true

      - name: Run QEMU smoke tests
        run: |
          OUTPUT_FILE=$(mktemp --suffix=.log)
          (printf " "; cat test_inputs.txt) | \
            timeout 15s qemu-system-arm -M lm3s811evb -serial stdio -display none \
              -kernel target/${{ env.RUST_TARGET }}/release/NumCore > "$OUTPUT_FILE" 2>&1 || true
          cp "$OUTPUT_FILE" /tmp/qemu-output.log
          echo "QEMU output saved to artifact"

      - name: Upload QEMU output
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-output
          path: /tmp/qemu-output.log

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ env.RUST_TARGET }}
          override: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build firmware (release)
        run: cargo build -p numcore-lm3s811 --release --target ${{ env.RUST_TARGET }} --verbose

      - name: Extract version
        run: |
          VERSION="v$(grep '^version' numcore-lm3s811/Cargo.toml | head -1 | cut -d'"' -f2)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get PR body from merge commit
        id: pr_body
        run: |
          PR_NUM=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'Merge pull request #\K\d+' || true)
          if [ -n "$PR_NUM" ]; then
            BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUM" | jq -r '.body // ""')
            echo "body<<EOF" >> $GITHUB_ENV
            echo "$BODY" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "body=Automated release" >> $GITHUB_ENV
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "NumCore ${{ env.VERSION }}"
          body: ${{ env.PR_BODY }}
          files: target/${{ env.RUST_TARGET }}/release/NumCore
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
